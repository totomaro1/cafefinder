<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카카오맵 주변 카페 찾기</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Malgun Gothic', sans-serif; color: #222; overflow: hidden; }
    
    /* 앱 전체 레이아웃 */
    .app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

    /* 최상단 탭 바 */
    .top-nav {
      display: flex; background: #212529; color: #fff; height: 48px; flex-shrink: 0; align-items: center; padding: 0 16px; justify-content: space-between;
    }
    .nav-title { font-weight: bold; font-size: 15px; }
    .nav-tabs { display: flex; gap: 8px; }
    .nav-tab-btn {
      background: transparent; border: none; color: #adb5bd; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;
    }
    .nav-tab-btn.active { background: #343a40; color: #fff; border-bottom: 2px solid #FEE500; }

    /* 탭 콘텐츠 영역 */
    .tab-view { display: none; flex: 1; width: 100%; height: calc(100vh - 48px); overflow: hidden; }
    .tab-view.active { display: flex; }

    /* [탭 1] 카페 찾기 메인 레이아웃 (좌우 분할) */
    .main-split-layout { display: flex; width: 100%; height: 100%; }
    
    /* 왼쪽 패널 (위: 주소입력, 아래: 카페목록) */
    .left-panel {
      width: 420px; min-width: 360px; height: 100%; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #ddd; z-index: 10;
    }
    
    /* 왼쪽 위: 주소 입력 */
    .search-section {
      padding: 16px; border-bottom: 1px solid #eee; background: #fff; flex-shrink: 0;
    }
    .search-box { display: flex; gap: 6px; }
    .search-box input {
      flex: 1; padding: 11px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; outline: none;
    }
    .search-box input:focus { border-color: #333; }
    .btn-search {
      padding: 0 16px; font-size: 14px; background: #FEE500; color: #191919; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap;
    }
    .btn-search:disabled { background: #e9ecef; color: #adb5bd; cursor: not-allowed; }
    .status-info { margin-top: 8px; font-size: 13px; font-weight: bold; color: #333; }
    .sub-status-info { font-size: 12px; color: #666; margin-top: 2px; }

    /* 왼쪽 아래: 카페 목록 */
    .cafe-list-section {
      flex: 1; overflow-y: auto; background: #fafafa;
    }
    .empty-guide { padding: 40px 20px; text-align: center; color: #888; font-size: 13px; line-height: 1.5; }
    .cafe-item {
      padding: 14px 16px; background: #fff; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.15s;
    }
    .cafe-item:hover { background: #f8f9fa; }
    .cafe-item.active { background: #fffdf0; border-left: 4px solid #FEE500; padding-left: 12px; }
    .cafe-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .cafe-name { font-size: 14px; font-weight: bold; color: #111; }
    .cafe-dist { font-size: 12px; font-weight: bold; color: #d97706; background: #fef3c7; padding: 2px 7px; border-radius: 10px; white-space: nowrap; margin-left: 6px; }
    .cafe-addr { font-size: 12px; color: #666; margin-bottom: 6px; line-height: 1.4; }
    .cafe-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .cafe-type {
      display: inline-flex; align-items: center; width: fit-content;
      max-width: 100%; margin-top: 3px; padding: 4px 9px;
      border-radius: 12px; background: #eef4ff; color: #315a9b;
      font-size: 11px; font-weight: bold; line-height: 1.4;
    }
    .cafe-type-note { color: #999; font-size: 10px; margin-left: 5px; font-weight: normal; }
    .cafe-link { color: #0068c3; text-decoration: none; font-weight: bold; }
    .cafe-link:hover { text-decoration: underline; }

    /* 오른쪽: 지도 */
    .right-map-panel {
      flex: 1; height: 100%; position: relative; background: #e9ecef;
    }
    #map { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 최상단 네비게이션 탭 -->
    <header class="top-nav">
      <div class="nav-title">☕ 카카오맵 카페 파인더</div>
      <div class="nav-tabs">
        <button class="nav-tab-btn active" onclick="switchTab('main')" id="tabBtnMain">🗺️ 카페 찾기</button>
        <button class="nav-tab-btn" onclick="switchTab('settings')" id="tabBtnSettings">🔑 API 키 설정</button>
      </div>
    </header>

    <!-- [탭 1] 메인 화면 (좌우 분할 - 순수 검색/지도 전용) -->
    <div id="viewMain" class="tab-view active">
      <div class="main-split-layout">
        <!-- 왼쪽 패널 (위: 주소 입력 / 아래: 카페 목록) -->
        <aside class="left-panel">
          <!-- 왼쪽 위: 주소 입력 -->
          <div class="search-section">
            <div class="search-box">
              <input type="text" id="queryInput" placeholder="주소, 아파트, 역명 입력 (예: 갈마동 큰마을아파트)" onkeydown="if(event.key==='Enter') searchLocationAndCafes()" disabled>
              <button id="searchBtn" class="btn-search" onclick="searchLocationAndCafes()" disabled>검색</button>
            </div>
            <div class="status-info" id="statusText">원하시는 주소나 장소명을 입력하세요.</div>
            <div class="sub-status-info" id="subStatusText"></div>
          </div>
          <!-- 왼쪽 아래: 카페 목록 -->
          <div class="cafe-list-section" id="cafeList">
            <div class="empty-guide">
              검색할 주소나 건물명을 입력하시면<br>반경 500m 이내의 카페를 찾아드립니다.
            </div>
          </div>
        </aside>

        <!-- 오른쪽: 지도 영역 -->
        <main class="right-map-panel">
          <div id="map">지도를 불러오는 중...</div>
        </main>
      </div>
    </div>

    <!-- [탭 2] API 키 설정 화면 -->
    <div id="viewSettings" class="tab-view settings-view">
      <div class="settings-card-wrapper">
        <div class="settings-card">
          <h3>🔑 카카오 JavaScript 키 설정</h3>
          <div class="settings-desc">
            기본 키로 자동 연결되지 않을 때 새 JavaScript 키를 입력하세요. 입력한 키는 브라우저에 저장됩니다.
          </div>
</div>

          <div class="input-group">
            <input type="text" id="apiKeyInput" placeholder="32자리 JavaScript 키 입력">
            <button class="btn-action" onclick="verifyAndLoadSDK()">키 검증 및 연결</button>
          </div>
</div>
</div>
    </div>
  </div>

  <script>
    let map = null;
    let geocoder = null;
    let ps = null;
    let markers = [];
    let currentInfowindow = null;
    let cafeSearchRequestId = 0;
    const DEFAULT_KAKAO_JS_KEY = '9ae1891ba1b0c1ff630450e76b284f50';

    window.onload = function() {
      const savedKey = localStorage.getItem('kakao_js_key');
      const hasCustomKey = localStorage.getItem('kakao_js_key_custom') === 'true';
      const initialKey = hasCustomKey && savedKey ? savedKey : DEFAULT_KAKAO_JS_KEY;
      document.getElementById('apiKeyInput').value = initialKey;

      if (window.location.protocol !== 'file:') {
        verifyAndLoadSDK(true, initialKey);
      } else {
        document.getElementById('statusText').innerText =
          '브라우저 보안 정책상 file://에서는 연결할 수 없습니다. 웹 서버에서 실행해주세요.';
        switchTab('settings');
      }
    };

    // 탭 전환 함수
    function switchTab(viewName) {
      document.querySelectorAll('.nav-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-view').forEach(view => view.classList.remove('active'));

      if (viewName === 'main') {
        document.getElementById('tabBtnMain').classList.add('active');
        document.getElementById('viewMain').classList.add('active');
        if (map && typeof map.relayout === 'function') {
          setTimeout(() => { map.relayout(); }, 50);
        }
      } else {
        document.getElementById('tabBtnSettings').classList.add('active');
        document.getElementById('viewSettings').classList.add('active');
      }
    }

    function verifyAndLoadSDK(isAuto = false, autoKey = '') {
      const key = (autoKey || document.getElementById('apiKeyInput').value).trim();
      const protocol = window.location.protocol;
      const origin = window.location.origin;

      if (!key) {
        if (!isAuto) alert('JavaScript 키를 입력해주세요.');
        return;
      }
      if (protocol === 'file:') {
        return alert('file:// 환경에서는 실행할 수 없습니다. 로컬 웹 서버(Live Server 등)를 이용해주세요.');
      }

      document.getElementById('statusText').innerText = '카카오 지도 연결 중...';

      const oldScript = document.getElementById('kakao-sdk-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'kakao-sdk-script';
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&libraries=services&autoload=false`;

      script.onload = function() {
        if (typeof kakao === 'undefined' || !kakao.maps) {
          document.getElementById('statusText').innerText = '기본 API 키 연결에 실패했습니다. API 키 설정 탭에서 새 JavaScript 키를 입력해주세요.';
          if (isAuto) switchTab('settings');
          return;
        }

        kakao.maps.load(function() {
          try {
            const mapContainer = document.getElementById('map');
            mapContainer.innerHTML = '';
            map = new kakao.maps.Map(mapContainer, {
              center: new kakao.maps.LatLng(36.3504, 127.3845),
              level: 4
            });
            geocoder = new kakao.maps.services.Geocoder();
            ps = new kakao.maps.services.Places();
            if (!isAuto) {
              localStorage.setItem('kakao_js_key', key);
              localStorage.setItem('kakao_js_key_custom', 'true');
            }

            document.getElementById('queryInput').disabled = false;
            document.getElementById('searchBtn').disabled = false;
            document.getElementById('statusText').innerText = '주소나 장소명을 입력해 주세요.';

            document.getElementById('statusText').innerText = '주소나 장소명을 입력해 주세요.';

            if (!isAuto) {
              setTimeout(() => {
                switchTab('main');
              }, 800);
            }
          } catch (e) {
            document.getElementById('statusText').innerText = `지도 초기화 오류: ${e.message}`;
          }
        });
      };

      script.onerror = function() {
        document.getElementById('statusText').innerText = isAuto
          ? '기본 API 키로 연결하지 못했습니다. API 키 설정 탭에서 새 JavaScript 키를 입력해주세요.'
          : '카카오 지도 연결에 실패했습니다. API 키와 플랫폼 설정을 확인해주세요.';
        if (isAuto) switchTab('settings');
      };

      document.head.appendChild(script);
    }

    function searchLocationAndCafes() {
      if (!map || !geocoder || !ps) return alert('상단 [API 키 설정] 탭에서 키 연결을 먼저 완료해주세요.');
      const query = document.getElementById('queryInput').value.trim();
      if (!query) return alert('주소나 장소명을 입력해주세요.');

      document.getElementById('statusText').innerText = `'${query}' 위치 탐색 중...`;
      document.getElementById('subStatusText').innerText = '';
      document.getElementById('cafeList').innerHTML = '<div class="empty-guide">검색 중입니다...</div>';

      geocoder.addressSearch(query, function(result, status) {
        if (status === kakao.maps.services.Status.OK && result.length > 0) {
          const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
          const resolvedAddress = result[0].road_address ? result[0].road_address.address_name : result[0].address_name;
          moveAndSearchCafes(coords, query, `주소 매칭: ${resolvedAddress}`);
        } else {
          ps.keywordSearch(query, function(placeData, placeStatus) {
            if (placeStatus === kakao.maps.services.Status.OK && placeData.length > 0) {
              const bestMatch = placeData[0];
              const coords = new kakao.maps.LatLng(bestMatch.y, bestMatch.x);
              const addrDetail = bestMatch.road_address_name || bestMatch.address_name;
              moveAndSearchCafes(coords, bestMatch.place_name, `장소 매칭: ${bestMatch.place_name} (${addrDetail})`);
            } else {
              document.getElementById('statusText').innerText = `❌ '${query}' 검색 결과가 없습니다.`;
              document.getElementById('subStatusText').innerText = '오타가 없는지 확인하거나 지역명을 함께 입력해 보세요.';
              document.getElementById('cafeList').innerHTML = '<div class="empty-guide">일치하는 주소나 장소를 찾지 못했습니다.</div>';
            }
          });
        }
      });
    }

    function moveAndSearchCafes(coords, label, matchInfo) {
      map.setCenter(coords);
      map.setLevel(4);
      clearMarkers();

      const centerMarker = new kakao.maps.Marker({ map: map, position: coords });
      markers.push(centerMarker);

      const centerInfo = new kakao.maps.InfoWindow({
        content: `<div style="padding:6px 10px; font-size:12px; font-weight:bold;">📍 ${label}</div>`
      });
      centerInfo.open(map, centerMarker);
      currentInfowindow = centerInfo;

      const listEl = document.getElementById('cafeList');
      listEl.innerHTML = '<div class="empty-guide">주변 카페를 검색하고 있습니다...</div>';
      document.getElementById('statusText').innerText = '카페 검색 중...';
      document.getElementById('subStatusText').innerText = matchInfo;

      // 카카오 장소 검색은 한 페이지당 최대 15개이며, 최대 3페이지(45개)까지 조회합니다.
      // 검색이 새로 시작되면 이전 검색의 늦은 응답은 무시합니다.
      const requestId = ++cafeSearchRequestId;
      const allCafes = [];
      const seenPlaceIds = new Set();
      let pagesFetched = 0;

      const finishSearch = () => {
        if (requestId !== cafeSearchRequestId) return;

        // 제외 업종을 먼저 걸러낸 뒤, 지정한 프랜차이즈를 목록 상단에 우선 정렬합니다.
        const visibleCafes = allCafes.filter(place => !isExcludedCafeType(place));
        const excludedCount = allCafes.length - visibleCafes.length;
        const brandPriority = (place) => {
          const name = String(place.place_name || '').replace(/\\s+/g, '').toLowerCase();
          if (/이디야/.test(name)) return 0;
          if (/컴포즈/.test(name)) return 1;
          if (/메가mgc|메가커피|메가엠지씨/.test(name)) return 2;
          if (/스타벅스/.test(name)) return 3;
          if (/투썸플레이스|투썸/.test(name)) return 4;
          return 5;
        };
        // 같은 우선순위 안에서는 기존 카카오 검색 순서를 유지합니다.
        visibleCafes.sort((a, b) => brandPriority(a) - brandPriority(b));

        document.getElementById('statusText').innerText =
          `주변 카페 ${visibleCafes.length}곳 (반경 2km · 최대 45곳 검색 · 제외 업종 ${excludedCount}곳)`;

        listEl.innerHTML = '';
        if (visibleCafes.length > 0) {
          renderCafes(visibleCafes);
        } else {
          listEl.innerHTML = '<div class="empty-guide">반경 2km 내에 표시할 카페가 없습니다.<br>제외 업종을 제외한 검색 결과가 없습니다.</div>';
        }
      };

      const handlePage = (data, status, pagination) => {
        if (requestId !== cafeSearchRequestId) return;

        if (status === kakao.maps.services.Status.OK) {
          data.forEach(place => {
            const placeId = String(place.id || `${place.x},${place.y},${place.place_name}`);
            if (!seenPlaceIds.has(placeId) && allCafes.length < 45) {
              seenPlaceIds.add(placeId);
              allCafes.push(place);
            }
          });
          pagesFetched += 1;

          document.getElementById('statusText').innerText =
            `카페 검색 중... ${allCafes.length}/45곳`;

          if (pagination && pagination.hasNextPage && pagesFetched < 3 && allCafes.length < 45) {
            pagination.nextPage();
            return;
          }

          finishSearch();
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
          if (allCafes.length > 0) {
            finishSearch();
          } else {
            document.getElementById('statusText').innerText = '주변 카페 0곳';
            listEl.innerHTML = '<div class="empty-guide">반경 2km 내에 등록된 카페가 없습니다.</div>';
          }
        } else {
          if (allCafes.length > 0) {
            finishSearch();
          } else {
            document.getElementById('statusText').innerText = '카페 검색 오류';
            listEl.innerHTML = '<div class="empty-guide">데이터를 불러오는 중 오류가 발생했습니다.</div>';
          }
        }
      };

      ps.categorySearch('CE7', handlePage, {
        location: coords,
        radius: 2000,
        sort: kakao.maps.services.SortBy.DISTANCE
      });
    }

    function renderCafes(cafes) {
      const listEl = document.getElementById('cafeList');
      const markerImage = new kakao.maps.MarkerImage(
        'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
        new kakao.maps.Size(24, 35)
      );

      cafes.forEach((place, index) => {
        const placePos = new kakao.maps.LatLng(place.y, place.x);
        const marker = new kakao.maps.Marker({
          map: map,
          position: placePos,
          title: place.place_name,
          image: markerImage
        });
        markers.push(marker);

        const cafeType = classifyCafeType(place);
        const safeName = escapeHtml(place.place_name || '이름 미등록 장소');
        const safeDistance = escapeHtml(place.distance || '?');
        const safePlaceUrl = escapeAttribute(place.place_url || '#');

        const infowindow = new kakao.maps.InfoWindow({
          content: `
            <div style="display:inline-block; box-sizing:border-box; width:max-content; min-width:280px; max-width:420px; padding:12px 16px; font-size:13px; line-height:1.55; white-space:nowrap; overflow:visible;">
              <div style="font-size:15px; font-weight:700; margin-bottom:7px; white-space:nowrap;">☕ ${safeName}</div>
              <div style="margin-bottom:7px; white-space:nowrap;">
                <span style="display:inline-block; padding:4px 10px; border-radius:12px; background:#eef4ff; color:#315a9b; font-weight:700; white-space:nowrap;">${escapeHtml(cafeType.label)}</span>
              </div>
              <div style="color:#666; white-space:nowrap;">중심지로부터 ${safeDistance}m</div>
            </div>
          `
        });

        const item = document.createElement('div');
        item.className = 'cafe-item';
        item.innerHTML = `
          <div class="cafe-header">
            <span class="cafe-name">${index + 1}. ${safeName}</span>
            <span class="cafe-dist">${safeDistance}m</span>
          </div>
          <div class="cafe-addr">${escapeHtml(place.road_address_name || place.address_name || '주소 정보 없음')}</div>
          <div class="cafe-footer">
            <div>
              <span class="cafe-type">${escapeHtml(cafeType.label)}</span>
              <span class="cafe-type-note">${escapeHtml(cafeType.source)}</span>
            </div>
            <a href="${safePlaceUrl}" target="_blank" rel="noopener noreferrer" class="cafe-link">상세보기 ↗</a>
          </div>
        `;

        const selectCafe = () => {
          document.querySelectorAll('.cafe-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          map.panTo(placePos);
          if (currentInfowindow) currentInfowindow.close();
          infowindow.open(map, marker);
          currentInfowindow = infowindow;
        };

        kakao.maps.event.addListener(marker, 'click', () => {
          selectCafe();
          item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        item.onclick = (e) => {
          if (e.target.closest('a')) return;
          selectCafe();
        };

        listEl.appendChild(item);
      });
    }

    // 제외 업종은 카카오 등록 업종과 판별된 유형을 확인합니다.
    // '다방'은 상호명에 포함된 경우가 아니라 업종 경로의 항목으로 분류된 경우에만 제외합니다.
    function isExcludedCafeType(place) {
      const category = String(place.category_name || '');
      const name = String(place.place_name || '');
      const detectedType = classifyCafeType(place).label;

      // 테마카페는 계속 제외하되, 최하위 업종이 디저트카페인 경우만 예외로 허용합니다.
      const excludedPattern = /키즈카페|어린이카페|보드게임카페|보드카페|만화카페|만화방|방탈출카페|이스케이프룸/i;
      const isDessertCafe = /디저트\\s*카페/i.test(detectedType.trim());
      const isThemeCafe =
        /테마카페/i.test(category) ||
        /테마카페/i.test(name) ||
        /테마카페/i.test(detectedType);
      const isDabangCategory =
        /(?:^|>)\\s*다방\\s*(?:>|$)/i.test(category) ||
        detectedType.trim() === '다방';

      return isDabangCategory ||
             excludedPattern.test(category) ||
             excludedPattern.test(name) ||
             excludedPattern.test(detectedType) ||
             (isThemeCafe && !isDessertCafe);
    }

    // 카카오 category_name은 "음식점 > 카페 > 커피전문점 > 컴포즈커피"처럼
    // 상위부터 하위 업종까지 이어지므로, 가장 마지막 항목을 우선 표시합니다.
    function classifyCafeType(place) {
      const rawCategory = String(place.category_name || '');
      const categoryParts = rawCategory
        .split('>')
        .map(part => part.trim())
        .filter(Boolean);

      if (categoryParts.length > 0) {
        return {
          label: categoryParts[categoryParts.length - 1],
          source: '카카오 최하위 업종'
        };
      }

      // 카카오 업종 경로가 비어 있는 경우에만 상호명으로 보조 추정합니다.
      const name = String(place.place_name || '').toLowerCase().replace(/\s+/g, '');
      const nameRules = [
        [/고양이|냥이|캣카페/, '고양이카페'],
        [/강아지|애견|멍멍|도그카페/, '애견카페'],
        [/보드게임|보드카페/, '보드게임카페'],
        [/만화카페|만화방/, '만화카페'],
        [/북카페|책카페/, '북카페'],
        [/스터디카페|스터디룸/, '스터디카페'],
        [/슬라임/, '슬라임 체험카페'],
        [/래빗룸|토끼룸/, '체험형 테마카페'],
        [/방탈출|이스케이프/, '방탈출카페'],
        [/키즈카페|플레이룸/, '키즈카페'],
        [/무인|언택트|셀프카페/, '무인카페'],
        [/베이커리|빵집|제과/, '베이커리카페'],
        [/디저트|케이크|마카롱|빙수|젤라또/, '디저트카페'],
        [/브런치/, '브런치카페'],
        [/로스터리|로스팅|원두/, '로스터리카페'],
        [/컴포즈/, '컴포즈커피'],
        [/메가\s?mgc|메가커피/, '메가MGC커피']
      ];

      for (const [pattern, label] of nameRules) {
        if (pattern.test(name)) {
          return { label, source: '상호명 기반 추정' };
        }
      }

      return {
        label: '세부 업종 확인 필요',
        source: '카카오 세부 업종 미등록'
      };
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function clearMarkers() {
      markers.forEach(m => m.setMap(null));
      markers = [];
      if (currentInfowindow) currentInfowindow.close();
    }
  </script>
