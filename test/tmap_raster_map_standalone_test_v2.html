<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMAP Raster Map 단독 테스트</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f8; color: #17202a; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .desc { margin: 0 0 20px; color: #5d6875; line-height: 1.55; }
    .panel { background: #fff; border: 1px solid #dce2e8; border-radius: 14px; padding: 18px; box-shadow: 0 3px 14px rgba(20,35,50,.05); }
    .keyrow { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 12px 13px; border: 1px solid #cbd3dc; border-radius: 9px; font-size: 15px; }
    button { border: 0; border-radius: 9px; padding: 11px 15px; font-size: 14px; font-weight: 650; cursor: pointer; background: #1769aa; color: white; }
    button.secondary { background: #e8edf2; color: #263442; }
    .hint { margin: 10px 0 0; color: #6b7580; font-size: 12px; line-height: 1.5; }
    .status { margin-top: 14px; padding: 12px 14px; border-radius: 9px; background: #eef2f6; color: #334155; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .status.error { background: #fff0ef; color: #a12d25; }
    #map_div { width: 100%; height: min(68vh, 650px); min-height: 420px; margin-top: 16px; background: #e7ebef; border: 1px solid #d1d8df; border-radius: 12px; overflow: hidden; }
    .foot { margin: 12px 2px 0; color: #6b7580; font-size: 12px; }
    @media (max-width: 620px) { .wrap { padding: 14px; } .keyrow { flex-direction: column; } #map_div { min-height: 360px; height: 58vh; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>TMAP Raster Map 단독 테스트</h1>
    <p class="desc">카페 파인더와 완전히 분리된 테스트 페이지입니다. 이번 버전은 TMAP SDK를 비동기 삽입하지 않고, HTML 파서가 읽는 일반 script 태그 방식으로 불러옵니다.</p>
    <section class="panel">
      <label for="appKey"><strong>TMAP AppKey</strong></label>
      <div class="keyrow" style="margin-top:8px">
        <input id="appKey" type="password" autocomplete="off" placeholder="발급받은 TMAP AppKey를 입력하세요">
        <button type="button" id="toggleKey" class="secondary">키 보기</button>
        <button type="button" id="loadMap">지도 불러오기</button>
      </div>
      <p class="hint">입력한 키는 URL이나 저장소에 기록하지 않습니다. 버튼을 누르면 현재 문서를 테스트용 문서로 다시 작성하고, SDK를 파서 차단 방식의 일반 script 태그로 로드합니다.</p>
      <div id="status" class="status">대기 중: AppKey를 입력하고 ‘지도 불러오기’를 눌러주세요.</div>
    </section>
  </main>
  <script>
    (() => {
      const keyEl = document.getElementById('appKey');
      document.getElementById('toggleKey').addEventListener('click', () => {
        const show = keyEl.type === 'password';
        keyEl.type = show ? 'text' : 'password';
        document.getElementById('toggleKey').textContent = show ? '키 숨기기' : '키 보기';
      });
      document.getElementById('loadMap').addEventListener('click', () => {
        const appKey = keyEl.value.trim();
        if (!appKey) { document.getElementById('status').textContent = 'AppKey를 먼저 입력해주세요.'; keyEl.focus(); return; }
        const sdkUrl = 'https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=' + encodeURIComponent(appKey);
        const page = `<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TMAP Raster Map 표시 테스트</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:1100px;margin:0 auto;padding:24px}h1{margin:0 0 8px;font-size:24px}.desc{margin:0 0 16px;color:#5d6875;line-height:1.5}.panel{background:#fff;border:1px solid #dce2e8;border-radius:14px;padding:18px}.actions{display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:9px;padding:11px 15px;font-size:14px;font-weight:650;cursor:pointer;background:#1769aa;color:#fff}button.secondary{background:#e8edf2;color:#263442}.status{margin-top:14px;padding:12px 14px;border-radius:9px;background:#eef2f6;color:#334155;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.status.ok{background:#e8f6ee;color:#17633b}.status.error{background:#fff0ef;color:#a12d25}#map_div{width:100%;height:min(68vh,650px);min-height:420px;margin-top:16px;background:#e7ebef;border:1px solid #d1d8df;border-radius:12px;overflow:hidden}.foot{margin:12px 2px 0;color:#6b7580;font-size:12px}@media(max-width:620px){.wrap{padding:14px}#map_div{min-height:360px;height:58vh}}
</style>
<!-- TMAP SDK: 일반 parser-inserted script. async/defer/dynamic insertion을 사용하지 않음. -->
<script src="${sdkUrl}"><\/script>
</head><body><main class="wrap"><h1>TMAP Raster Map 표시 테스트</h1><p class="desc">SDK가 로드된 뒤 지도 객체를 생성합니다. 콘솔에서 document.write 관련 오류가 사라졌는지도 확인해주세요.</p><section class="panel"><div class="actions"><button id="addMarker" class="secondary" disabled>중심에 마커 추가</button><button id="resetMap" class="secondary" disabled>대전 중심으로 이동</button><button id="back" class="secondary">AppKey 다시 입력</button></div><div id="status" class="status">SDK 로딩 확인 중...</div><div id="map_div" aria-label="TMAP Raster Map 테스트 지도"></div><p class="foot">초기 중심: 대전광역시청 부근 (위도 36.3504, 경도 127.3845) · Raster Map JS V2</p></section></main>
<script>
(function(){
'use strict';
const center={lat:36.3504,lng:127.3845};
const status=document.getElementById('status');
const markerBtn=document.getElementById('addMarker');
const resetBtn=document.getElementById('resetMap');
let map=null,marker=null;
function report(msg,type){status.textContent=msg;status.className='status'+(type?' '+type:'');}
try{
 if(!window.Tmapv2 || typeof window.Tmapv2.Map!=='function'){
   throw new Error('SDK script 실행 후에도 Tmapv2.Map 객체가 없습니다. 이번에는 비동기 로딩을 제거했으므로, 이 상태라면 AppKey·상품 권한·허용 도메인 또는 SDK 응답 자체를 추가 확인해야 합니다.');
 }
 map=new Tmapv2.Map('map_div',{center:new Tmapv2.LatLng(center.lat,center.lng),width:'100%',height:'100%',zoom:15,zoomControl:true,scrollwheel:true});
 markerBtn.disabled=false;resetBtn.disabled=false;
 report('Tmapv2.Map 객체 생성 성공. 실제 지도 타일이 표시되는지 확인해주세요.','ok');
}catch(e){report('지도 초기화 실패\\n'+(e&&e.message?e.message:String(e)),'error');console.error('TMAP Raster Map init error:',e);}
markerBtn.addEventListener('click',function(){if(!map)return;if(marker)marker.setMap(null);marker=new Tmapv2.Marker({position:new Tmapv2.LatLng(center.lat,center.lng),map:map,title:'테스트 마커'});report('테스트 마커를 지도 중심에 추가했습니다.','ok');});
resetBtn.addEventListener('click',function(){if(!map)return;map.setCenter(new Tmapv2.LatLng(center.lat,center.lng));map.setZoom(15);report('지도를 대전 중심으로 이동했습니다.','ok');});
document.getElementById('back').addEventListener('click',function(){location.reload();});
})();
<\/script></body></html>`;
        document.open();
        document.write(page);
        document.close();
      });
    })();
  </script>
</body>
</html>
